  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETB Save Manager</title>

    <!-- 预连接关键资源 -->
    <link rel="preconnect" href="/" crossorigin />

    <!-- 预加载关键CSS -->
    <link rel="preload" href="./src/styles/variables.css" as="style" />

    <!-- 预加载关键JS模块 -->
    <link rel="modulepreload" href="/src/main.ts" />

    <!-- 内联关键CSS - 避免FOUC -->
    <style>
      /* 主题变量 */
      :root {
        --bg: #f8f9fa;
        --text: #1c1c1e;
      }

      html[data-theme="dark"] {
        --bg: #0a0c10;
        --text: #f8f9fa;
      }

      html[data-theme="new-year"] {
        --bg: #1a0a0a;
        --text: #f8f9fa;
      }

      html[data-theme="spring-festival-dark"] {
        --bg: #1c0a14;
        --text: #f8f9fa;
      }

      html[data-theme="spring-festival-light"] {
        --bg: #fefce8;
        --text: #1c1c1e;
      }

      html,
      body {
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "San Francisco", "Helvetica Neue", sans-serif;
      }

      #app {
        min-height: 100vh;
        background: var(--bg);
      }

      /* 启动时禁用所有过渡动画 */
      html.no-transition,
      html.no-transition *,
      html.no-transition *::before,
      html.no-transition *::after {
        transition: none !important;
        animation-duration: 0s !important;
      }
    </style>

    <!-- 主题初始化脚本 - 必须在 style 之后立即执行 -->
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("theme");
          if (saved) {
            // 处理可能被 JSON.stringify 的值
            theme = saved.replace(/^"|"$/g, "");
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (e) {}

        // 立即设置主题属性
        document.documentElement.setAttribute("data-theme", theme);

        // 立即设置背景色，不等待 CSS 变量生效
        var bgColors = {
          dark: "#0a0c10",
          light: "#f8f9fa",
          "new-year": "#1a0a0a",
          "spring-festival-dark": "#1c0a14",
          "spring-festival-light": "#fefce8",
        };
        var bg = bgColors[theme] || bgColors["light"];
        document.documentElement.style.backgroundColor = bg;

        // 保存到全局变量
        window.__initialTheme = theme;
      })();
    </script>

    <!-- 延迟加载非关键CSS -->
    <link rel="stylesheet" href="./src/styles/variables.css" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
  </head>
